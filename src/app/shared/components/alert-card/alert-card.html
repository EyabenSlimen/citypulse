<article
  class="rounded-2xl border border-white/10 bg-white/5 p-5 shadow-lg backdrop-blur-md transition duration-300 hover:-translate-y-1 hover:shadow-[0_0_30px_rgba(245,158,11,0.2)]"
>
  <div class="flex items-start justify-between gap-3">
    <span class="text-3xl">{{ typeIcon() }}</span>
    <app-severity-badge [severity]="alert().severity" />
  </div>

  <h3 class="mt-3 font-['Poppins'] text-lg font-semibold text-white">{{ alert().title }}</h3>
  <p class="mt-2 text-sm text-slate-300">{{ alert().description }}</p>

  <p class="mt-3 text-sm text-[#2DD4BF]">📍 {{ alert().location }}</p>
  <p class="text-xs text-slate-400">🕒 {{ alert().createdAt | date: 'dd/MM/yyyy HH:mm' }}</p>

  <button
    type="button"
    (click)="remove.emit(alert())"
    class="mt-4 w-full rounded-xl border border-red-400/50 px-4 py-2 text-sm font-semibold text-red-300 transition hover:bg-red-500/20"
  >
    Supprimer
  </button>
</article>
