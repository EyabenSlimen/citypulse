<article
  class="group overflow-hidden rounded-2xl border border-white/10 bg-white/5 shadow-lg backdrop-blur-md transition duration-300 hover:-translate-y-1 hover:shadow-[0_0_30px_rgba(45,212,191,0.25)]"
>
  <img
    [src]="event().image"
    [alt]="event().title"
    class="h-48 w-full object-cover transition duration-500 group-hover:scale-105"
  />
  <div class="p-5">
    <span class="rounded-full bg-[#F59E0B]/20 px-3 py-1 text-xs font-semibold text-[#F59E0B]">
      {{ event().category }}
    </span>
    <h3 class="mt-3 font-['Poppins'] text-lg font-semibold text-white">{{ event().title }}</h3>
    <p class="mt-2 text-sm text-slate-300">📅 {{ event().date | date: 'dd/MM/yyyy HH:mm' }}</p>
    <p class="text-sm text-slate-300">📍 {{ event().location }}</p>
    <p class="text-sm text-[#2DD4BF]">👥 {{ event().participants }} participants</p>

    <div class="mt-4 flex gap-2">
      <a
        [routerLink]="['/events', event().id]"
        class="flex-1 rounded-xl border border-[#2DD4BF] px-4 py-2 text-center text-sm font-semibold text-[#2DD4BF] transition hover:bg-[#2DD4BF] hover:text-[#0F172A]"
      >
        Détails
      </a>
      <button
        type="button"
        (click)="participate.emit(event())"
        class="flex-1 rounded-xl bg-[#F59E0B] px-4 py-2 text-sm font-semibold text-[#0F172A] transition hover:brightness-110"
      >
        Je participe
      </button>
    </div>
  </div>
</article>
