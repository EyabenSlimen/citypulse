<section class="min-h-screen bg-[#0F172A] px-4 py-10">
  <div class="mx-auto max-w-6xl">
    <div class="flex flex-wrap items-center justify-between gap-4">
      <div>
        <h1 class="font-['Poppins'] text-3xl font-bold text-white">🚧 Signalements</h1>
        <p class="mt-2 text-slate-300">Routes bloquées, travaux, accidents, coupures d'eau.</p>
      </div>
      <a
        routerLink="/alerts/new"
        class="rounded-xl bg-[#F59E0B] px-5 py-3 font-semibold text-[#0F172A] transition hover:brightness-110"
      >
        + Signaler un problème
      </a>
    </div>

    @if (loading()) {
      <p class="mt-8 text-[#2DD4BF]">Chargement...</p>
    } @else if (error()) {
      <p class="mt-8 rounded-xl bg-red-500/20 p-4 text-red-300">{{ error() }}</p>
    } @else {
      <div class="mt-8 grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
        @for (a of alerts(); track a.id) {
          <app-alert-card [alert]="a" (remove)="onRemove($event)" />
        } @empty {
          <p class="text-slate-300">Aucun signalement pour le moment. 🎉</p>
        }
      </div>
    }
  </div>
</section>
