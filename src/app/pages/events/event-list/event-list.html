<section class="min-h-screen bg-[#0F172A] px-4 py-10">
  <div class="mx-auto max-w-6xl">
    <h1 class="font-['Poppins'] text-3xl font-bold text-white">🎉 Événements</h1>
    <p class="mt-2 text-slate-300">Concerts, marchés, expositions : ce qui se passe dans votre ville.</p>

    @if (loading()) {
      <p class="mt-8 text-[#2DD4BF]">Chargement...</p>
    } @else if (error()) {
      <p class="mt-8 rounded-xl bg-red-500/20 p-4 text-red-300">{{ error() }}</p>
    } @else {
      <div class="mt-8 grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
        @for (e of events(); track e.id) {
          <app-event-card [event]="e" (participate)="onParticipate($event)" />
        } @empty {
          <p class="text-slate-300">Aucun événement pour le moment.</p>
        }
      </div>
    }
  </div>
</section>
