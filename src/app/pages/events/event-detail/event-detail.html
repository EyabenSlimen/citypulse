<section class="min-h-screen bg-[#0F172A] px-4 py-10">
  <div class="mx-auto max-w-3xl">
    <a routerLink="/events" class="text-sm text-[#2DD4BF] hover:underline">← Retour aux événements</a>

    @if (event(); as e) {
      <article class="mt-6 overflow-hidden rounded-2xl border border-white/10 bg-white/5 backdrop-blur-md">
        <img [src]="e.image" [alt]="e.title" class="h-72 w-full object-cover" />
        <div class="p-6">
          <span class="rounded-full bg-[#F59E0B]/20 px-3 py-1 text-xs font-semibold text-[#F59E0B]">
            {{ e.category }}
          </span>
          <h1 class="mt-3 font-['Poppins'] text-3xl font-bold text-white">{{ e.title }}</h1>
          <p class="mt-4 text-slate-200">{{ e.description }}</p>

          <div class="mt-6 space-y-1 text-slate-300">
            <p>📅 {{ e.date | date: 'dd/MM/yyyy HH:mm' }}</p>
            <p>📍 {{ e.location }}</p>
            <p class="text-[#2DD4BF]">👥 {{ e.participants }} participants</p>
          </div>

          <button
            type="button"
            (click)="participate()"
            class="mt-6 rounded-xl bg-[#F59E0B] px-6 py-3 font-semibold text-[#0F172A] transition hover:brightness-110"
          >
            Je participe
          </button>
        </div>
      </article>
    } @else if (error()) {
      <p class="mt-6 rounded-xl bg-red-500/20 p-4 text-red-300">{{ error() }}</p>
    } @else {
      <p class="mt-6 text-[#2DD4BF]">Chargement...</p>
    }
  </div>
</section>
